# # 代码CI快速集成流水线，lint、fix、build

name: CI
# # 触发条件
on:
  # 提PR到next分支触发CI
  pull_request:
    branches:
      - next
  push:
    branches:
      - next

  # 手动触发部署
  workflow_dispatch:

  schedule:
    - cron: '0 0 1 * *'

# 环境变量
env:
  #  阿里云仓库信息
  REGISTRY: registry.cn-hangzhou.aliyuncs.com
  UserName: 142vip
  # Node / pnpm 版本与 package.json、.nvmrc 保持一致
  NODE_VERSION: 25.9.0
  PNPM_VERSION: 9.15.0

jobs:
  Base-Build:
    name: 基础编译构建
    runs-on: ubuntu-24.04
    # 主库且拉取PR时触发
    if: github.repository == '142vip/408CSFamily' &&  github.event_name == 'pull_request'
    permissions:
      actions: read
      pull-requests: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          # “最近更新时间” 等 git 日志相关信息，需要拉取全部提交记录
          fetch-depth: 0

      # 安装 PNPM（版本与 package.json packageManager 一致）
      - name: PNPM Install
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      # 安装 Node 环境（版本与 .nvmrc / engines.node 一致）
      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # 下载依赖，并执行初始化脚本
      - name: Install Dependencies
        run: |
          ./scripts/ci

      - name: Code LintFix
        run: |
          pnpm lint

      - name: Build Site
        run: |
          pnpm build

      - name: Build Site With Proxy
        run: |
          pnpm build:proxy

  Build-Docker-Image:
    name: 构建Docker镜像
    runs-on: ubuntu-24.04
    # 主库且tag更新时执行
    if: github.repository == '142vip/408CSFamily' && startsWith(github.event.head_commit.message, 'chore(release):')
    permissions:
      actions: read
      pull-requests: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          # “最近更新时间” 等 git 日志相关信息，需要拉取全部提交记录
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker
        run: |
          docker version
          echo "-----------Docker Login-----------"
          docker login \
          --username=${{ env.UserName }} \
          --password=${{ secrets.DOCKER_PASSWORD }} \
          ${{env.REGISTRY}}

      # 安装 PNPM（版本与 package.json packageManager 一致）
      - name: PNPM Install
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      # 安装 Node 环境（版本与 .nvmrc / engines.node 一致）
      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # 下载依赖，并执行初始化脚本
      - name: Install Dependencies
        run: |
          ./scripts/ci

      #       # 构建，支持domain
      #      - name: Build To Dist
      #        run: |
      #          pnpm build

      # 快速构建并推送
      - name: Push Docker Image
        run: |
          ./scripts/build-image
